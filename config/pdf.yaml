# ==============================================================
#  Настройки PDF-каталогов вакансий.
#
#  Этот файл можно править без знания программирования.
#  Тексты — в кавычках. Цвета — в формате "#RRGGBB".
#  После правки запустите: python src/make_pdfs.py
#  (или дважды кликните по make_pdfs.bat)
# ==============================================================

# ---------- Общее для обоих документов ----------
common:
  # Кто источник — выводится в подвале каждой страницы
  source: "Региональный кадровый центр Краснодарского края"

  # Цвета интерфейса
  colors:
    primary: "#1a3a5c"       # тёмно-синий: заголовки, шапка таблицы
    accent: "#d6e4f0"        # светло-синий: фон названий районов
    row_alt: "#f5f8fb"       # почти белый: чередование строк
    text_muted: "#555555"    # серый: мелкий текст на титуле

  # Меры поддержки в колонке «Социальная поддержка».
  # key   — название поля в CSV (лучше не менять).
  # label — как это подписано в PDF (можно менять свободно).
  # Если удалить пункт — он пропадёт из PDF.
  # Если добавить новый key, которого нет в CSV — он не отобразится.
  support_flags:
    - key: mentors
      label: Наставничество
    - key: housing
      label: Жильё
    - key: social_land
      label: Участок
    - key: social_communal
      label: ЖКХ
    - key: zemskii
      label: Земский
    - key: social_rent
      label: Аренда
    - key: social_mortgage
      label: Ипотека
    - key: social_deposit
      label: Вклад

# ---------- Документ для выпускников вузов ----------
vuz:
  template: "report.html"                 # какой HTML использовать
  output: "vacancies_vuz.pdf"          # куда сохранить

  title: "Вакансии для выпускников медицинских вузов"
  subtitle: "Краснодарский край • Региональный кадровый центр"
  description: >
    В документе собраны актуальные вакансии для выпускников медицинских
    вузов: врачей и специалистов с высшим сестринским образованием.
    Вакансии сгруппированы по муниципальным образованиям. В графе
    «Социальная поддержка» указаны меры, доступные при трудоустройстве:
    служебное жильё, компенсация аренды, выплаты по программам
    «Земский доктор» и другие.

  # Колонки таблицы. Порядок — как в PDF.
  # Сумма всех width ≈ 100%.
  # Допустимые значения key: n, title, organization, qty, support, area,
  #                          speciality, work_mode.
  columns:
    - key: n
      title: "№"
      width: "6%"
    - key: title
      title: "Должность"
      width: "35%"
    - key: organization
      title: "Медицинская организация"
      width: "35%"
    - key: qty
      title: "Кол-во"
      width: "7%"
    - key: support
      title: "Социальная поддержка"
      width: "17%"

